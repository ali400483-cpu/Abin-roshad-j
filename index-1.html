<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة أعمال الطلاب | مدارس ابن رشد</title><style>
:root{--navy:#123550;--blue:#17658b;--gold:#c9a45d;--bg:#f3f6f9;--ink:#1c3447}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{background:linear-gradient(115deg,#102f49,#216a8d);color:white;padding:22px 18px;border-bottom:5px solid var(--gold)}.head{max-width:1050px;margin:auto;display:flex;align-items:center;gap:15px}.seal{height:66px;width:66px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:28px;color:#f2d69c}h1{font-size:25px;margin:0 0 7px}header p{margin:0;color:#dceaf0}.wrap{max-width:1050px;margin:28px auto;padding:0 15px}.panel{background:white;border:1px solid #e2e8ee;border-radius:14px;box-shadow:0 5px 24px #1235500d;padding:25px;margin-bottom:18px}.login{max-width:430px;margin:65px auto;text-align:center}.login h2{margin-top:0}.muted{color:#617585;font-size:14px}label{font-weight:700;font-size:14px;display:block;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #ccd7df;border-radius:8px;padding:12px;background:white;color:#18364c;font:inherit;min-height:44px}textarea{min-height:110px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #a7d3e5;border-color:#2d7fa3}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.field{min-width:0}.wide{grid-column:1/-1}h2{font-size:21px;color:#123b57}h3{font-size:17px;margin:24px 0 15px;color:#175777;border-bottom:1px solid #e8edf0;padding-bottom:10px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{border:0;border-radius:9px;padding:12px 22px;font:inherit;font-weight:bold;cursor:pointer;background:var(--blue);color:white}.btn.secondary{background:#e5edf2;color:#194763}.btn.gold{background:var(--gold);color:#142f42}.btn:disabled{opacity:.6;cursor:wait}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.rating{padding:14px;background:#f7fafc;border:1px solid #e1e9ef;border-radius:9px}.rating label{margin-bottom:10px}.rating select{max-width:100%}.msg{padding:12px;margin:14px 0;border-radius:8px;background:#e9f3fa;color:#164b69;display:none}.msg.error{background:#fff0ee;color:#9e3228}.archive{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:right;padding:12px;border-bottom:1px solid #e8edf0;font-size:13px}th{background:#e9f1f6;color:#154563}tr:hover td{background:#fafcfd}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:12px}footer{text-align:center;color:#6d8291;font-size:12px;padding:20px}@media(max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:17px}.head h1{font-size:20px}.seal{height:55px;width:55px}header{padding:16px}}@media print{header,.tabs,.noprint,footer{display:none!important}body{background:white}.panel{box-shadow:none;border:0}#printView{display:block!important}}
</style></head><body><header><div class="head"><div class="seal">✦</div><div><h1>مدارس ابن رشد</h1><p>منصة متابعة أعمال الطلاب</p></div></div></header><main class="wrap"><section id="loginPage" class="panel login"><h2>تسجيل الدخول</h2><p class="muted">أدخل كلمة المرور للوصول إلى المنصة</p><form id="loginForm"><label for="pass">كلمة المرور</label><input id="pass" type="password" required autocomplete="current-password" placeholder="كلمة المرور"><p id="loginMsg" class="msg error"></p><button class="btn" type="submit" style="width:100%;margin-top:14px">دخول المنصة</button></form></section><section id="appPage" class="hidden"><div class="topbar noprint"><h2>متابعة أعمال الطلاب</h2><button id="logout" class="btn secondary">تسجيل الخروج</button></div><div class="tabs noprint"><button class="btn" id="formTab">تسجيل متابعة جديدة</button><button class="btn secondary" id="archiveTab">أرشيف التقارير</button></div><section id="formPage" class="panel"><h2>نموذج متابعة أعمال الطلاب</h2><form id="reportForm"><div class="grid"><div class="field"><label for="follow_date">تاريخ المتابعة</label><input id="follow_date" type="date" required></div><div class="field"><label for="follower">اسم المتابع</label><select id="follower" required><option value="">اختر المتابع</option><option>أحمد بكري</option><option>ماجد عريشي</option><option>حاتم واصلي</option><option>أخرى</option></select></div><div class="field"><label for="teacher">اسم المعلم</label><input id="teacher" required placeholder="اكتب اسم المعلم" maxlength="150"></div><div class="field"><label for="subject">المادة</label><select id="subject" required><option value="">اختر المادة</option><option>اللغة العربية</option><option>الرياضيات</option><option>العلوم</option><option>اللغة الإنجليزية</option><option>الدراسات الإسلامية</option><option>الدراسات الاجتماعية</option><option>الفيزياء</option><option>الكيمياء</option><option>الأحياء</option><option>الحاسب الآلي</option><option>أخرى</option></select></div><div class="field"><label for="grade">الصف</label><select id="grade" required><option value="">اختر الصف</option><option>الرابع</option><option>الخامس</option><option>السادس</option><option>الأول متوسط</option><option>الثاني متوسط</option><option>الثالث متوسط</option><option>الأول ثانوي</option><option>الثاني ثانوي</option><option>الثالث ثانوي</option></select></div><div class="field"><label for="classroom">الفصل</label><input id="classroom" required placeholder="مثال: أ / 1" maxlength="40"></div><div class="field wide"><label for="followup_type">نوع المتابعة</label><select id="followup_type" required><option value="">اختر نوع المتابعة</option><option>الواجبات اليومية</option><option>كتاب الطلاب</option><option>ملف الإنجاز</option><option>الاختبارات الفترية</option><option>المهام الأدائية</option><option>تقويمات أخرى</option></select></div></div><h3>نتيجة المتابعة</h3><div class="grid"><div class="rating"><label for="correction_rating">متابعة التصحيح</label><select id="correction_rating" required></select></div><div class="rating"><label for="suitability_rating">ملاءمة الواجبات لما تم تدريسه</label><select id="suitability_rating" required></select></div><div class="rating"><label for="reinforcement_rating">التوجيه والتعزيز من قبل المعلم</label><select id="reinforcement_rating" required></select></div><div class="field wide"><label for="recommendations">التوصيات</label><textarea id="recommendations" placeholder="اكتب التوصيات والملاحظات هنا" maxlength="4000"></textarea></div></div><div id="saveMsg" class="msg"></div><button id="saveBtn" class="btn gold noprint" type="submit">حفظ التقرير</button><button type="reset" class="btn secondary noprint">تفريغ النموذج</button></form></section><section id="archivePage" class="panel hidden"><h2>أرشيف التقارير</h2><div class="grid noprint" style="margin-bottom:18px"><div class="field"><label for="search">البحث في التقارير</label><input id="search" placeholder="اسم المعلم، المتابع، المادة، الصف..."></div><div class="field"><label for="filterType">نوع المتابعة</label><select id="filterType"><option value="">جميع الأنواع</option><option>الواجبات اليومية</option><option>كتاب الطلاب</option><option>ملف الإنجاز</option><option>الاختبارات الفترية</option><option>المهام الأدائية</option><option>تقويمات أخرى</option></select></div><div class="field"><label for="filterDate">تاريخ المتابعة</label><input id="filterDate" type="date"></div></div><div class="toolbar noprint" style="margin-bottom:12px"><span id="count" class="muted"></span><button id="refresh" class="btn secondary">تحديث الأرشيف</button></div><div id="archiveMsg" class="msg"></div><div class="archive"><table><thead><tr><th>التاريخ</th><th>المتابع</th><th>المعلم</th><th>المادة</th><th>الصف/الفصل</th><th>نوع المتابعة</th><th>التقييمات</th><th>التقرير</th></tr></thead><tbody id="reportRows"></tbody></table></div></section><section id="printView" class="panel hidden"></section></section></main><footer>مدارس ابن رشد — منصة متابعة أعمال الطلاب</footer><script>
const URL='https://vyukcefwsgtghobvqwvz.supabase.co';const KEY='sb_publishable_TLOQR-T7Dix7siuLgJcV2A_GLBMH4VM';let password='',reports=[];const $=id=>document.getElementById(id);const fields=['follow_date','follower','teacher','subject','grade','classroom','followup_type','correction_rating','suitability_rating','reinforcement_rating','recommendations'];const ratings=['','ممتاز','جيد جداً','متوسط','ضعيفة'];for(const id of ['correction_rating','suitability_rating','reinforcement_rating'])$(id).innerHTML=ratings.map((r,i)=>`<option value="${r}">${i?r:'اختر التقييم'}</option>`).join('');$('follow_date').value=new Date().toLocaleDateString('en-CA');function message(id,text,error=false){const e=$(id);e.textContent=text;e.classList.toggle('error',error);e.style.display=text?'block':'none'}async function rpc(fn,params){const r=await fetch(URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(params)});const raw=await r.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!r.ok)throw new Error(data?.message||data?.hint||'تعذر الاتصال بالخادم');return data}function showPage(name){$('formPage').classList.toggle('hidden',name!=='form');$('archivePage').classList.toggle('hidden',name!=='archive');$('printView').classList.add('hidden');$('formTab').className='btn'+(name==='form'?'':' secondary');$('archiveTab').className='btn'+(name==='archive'?'':' secondary');if(name==='archive')loadReports()}$('loginForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const p=$('pass').value;const ok=await rpc('student_followup_login',{p_password:p});if(ok!==true)throw Error('كلمة المرور غير صحيحة');password=p;$('loginPage').classList.add('hidden');$('appPage').classList.remove('hidden');$('pass').value='';message('loginMsg','')}catch(err){message('loginMsg',err.message,true)}finally{btn.disabled=false}};$('logout').onclick=()=>{password='';reports=[];$('appPage').classList.add('hidden');$('loginPage').classList.remove('hidden')};$('formTab').onclick=()=>showPage('form');$('archiveTab').onclick=()=>showPage('archive');$('reportForm').onsubmit=async e=>{e.preventDefault();const data={};for(const id of fields)data[id]=$(id).value.trim();const btn=$('saveBtn');btn.disabled=true;message('saveMsg','جارٍ الحفظ...');try{await rpc('student_followup_save',{p_password:password,p_report:data});message('saveMsg','تم حفظ تقرير المتابعة بنجاح.');e.target.reset();$('follow_date').value=new Date().toLocaleDateString('en-CA')}catch(err){message('saveMsg','تعذر الحفظ: '+err.message,true)}finally{btn.disabled=false}};async function loadReports(){message('archiveMsg','جارٍ تحميل التقارير...');try{reports=await rpc('student_followup_list',{p_password:password});message('archiveMsg','');renderReports()}catch(err){message('archiveMsg','تعذر تحميل التقارير: '+err.message,true)}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderReports(){const q=$('search').value.trim().toLowerCase(),t=$('filterType').value,d=$('filterDate').value;const filtered=reports.filter(r=>(!t||r.followup_type===t)&&(!d||r.follow_date===d)&&(!q||[r.follower,r.teacher,r.subject,r.grade,r.classroom,r.followup_type].some(v=>String(v||'').toLowerCase().includes(q))));$('count').textContent=`عدد التقارير: ${filtered.length}`;$('reportRows').innerHTML=filtered.map(r=>`<tr><td>${esc(r.follow_date)}</td><td>${esc(r.follower)}</td><td>${esc(r.teacher)}</td><td>${esc(r.subject)}</td><td>${esc(r.grade)} / ${esc(r.classroom)}</td><td>${esc(r.followup_type)}</td><td>التصحيح: ${esc(r.correction_rating)}<br>الملاءمة: ${esc(r.suitability_rating)}<br>التوجيه: ${esc(r.reinforcement_rating)}</td><td><button class="btn secondary" data-id="${esc(r.id)}">عرض / طباعة</button></td></tr>`).join('')||'<tr><td colspan="8">لا توجد تقارير مطابقة.</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>printReport(b.dataset.id))}['search','filterType','filterDate'].forEach(id=>$(id).addEventListener('input',renderReports));$('refresh').onclick=loadReports;function printReport(id){const r=reports.find(x=>String(x.id)===String(id));if(!r)return;const names={follow_date:'تاريخ المتابعة',follower:'اسم المتابع',teacher:'اسم المعلم',subject:'المادة',grade:'الصف',classroom:'الفصل',followup_type:'نوع المتابعة',correction_rating:'متابعة التصحيح',suitability_rating:'ملاءمة الواجبات لما تم تدريسه',reinforcement_rating:'التوجيه والتعزيز من قبل المعلم',recommendations:'التوصيات'};$('printView').innerHTML='<h2>مدارس ابن رشد — تقرير متابعة أعمال الطلاب</h2>'+Object.entries(names).map(([k,v])=>`<p style="border-bottom:1px solid #ddd;padding:10px"><b>${v}:</b> ${esc(r[k])||'—'}</p>`).join('')+'<p class="muted">تقرير صادر من منصة متابعة أعمال الطلاب</p><button class="btn noprint" onclick="window.print()">طباعة التقرير</button><button class="btn secondary noprint" id="closePrint">العودة للأرشيف</button>';$('formPage').classList.add('hidden');$('archivePage').classList.add('hidden');$('printView').classList.remove('hidden');$('closePrint').onclick=()=>showPage('archive')}
</script></body></html>

ssword='';reports=[];$('appPage').classList.add('hidden');$('loginPage').classList.remove('hidden')};$('formTab').onclick=()=>showPage('form');$('archiveTab').onclick=()=>showPage('archive');$('reportForm').onsubmit=async e=>{e.preventDefault();const data={};for(const id of fields)data[id]=$(id).value.trim();const btn=$('saveBtn');btn.disabled=true;message('saveMsg','جارٍ الحفظ...');try{await rpc('student_followup_save',{p_password:password,p_report:data});message('saveMsg','تم حفظ تقرير المتابعة بنجاح.');e.target.reset();$('follow_date').value=new Date().toLocaleDateString('en-CA')}catch(err){message('saveMsg','تعذر الحفظ: '+err.message,true)}finally{btn.disabled=false}};async function loadReports(){message('archiveMsg','جارٍ تحميل التقارير...');try{reports=await rpc('student_followup_list',{p_password:password});message('archiveMsg','');renderReports()}catch(err){message('archiveMsg','تعذر تحميل التقارير: '+err.message,true)}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderReports(){const q=$('search').value.trim().toLowerCase(),t=$('filterType').value,d=$('filterDate').value;const filtered=reports.filter(r=>(!t||r.followup_type===t)&&(!d||r.follow_date===d)&&(!q||[r.follower,r.teacher,r.subject,r.grade,r.classroom,r.followup_type].some(v=>String(v||'').toLowerCase().includes(q))));$('count').textContent=`عدد التقارير: ${filtered.length}`;$('reportRows').innerHTML=filtered.map(r=>`<tr><td>${esc(r.follow_date)}</td><td>${esc(r.follower)}</td><td>${esc(r.teacher)}</td><td>${esc(r.subject)}</td><td>${esc(r.grade)} / ${esc(r.classroom)}</td><td>${esc(r.followup_type)}</td><td>التصحيح: ${esc(r.correction_rating)}<br>الملاءمة: ${esc(r.suitability_rating)}<br>التوجيه: ${esc(r.reinforcement_rating)}</td><td><button class="btn secondary" data-id="${esc(r.id)}">عرض / طباعة</button></td></tr>`).join('')||'<tr><td colspan="8">لا توجد تقارير مطابقة.</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>printReport(b.dataset.id))}['search','filterType','filterDate'].forEach(id=>$(id).addEventListener('input',renderReports));$('refresh').onclick=loadReports;function printReport(id){const r=reports.find(x=>String(x.id)===String(id));if(!r)return;const names={follow_date:'تاريخ المتابعة',follower:'اسم المتابع',teacher:'اسم المعلم',subject:'المادة',grade:'الصف',classroom:'الفصل',followup_type:'نوع المتابعة',correction_rating:'متابعة التصحيح',suitability_rating:'ملاءمة الواجبات لما تم تدريسه',reinforcement_rating:'التوجيه والتعزيز من قبل المعلم',recommendations:'التوصيات'};$('printView').innerHTML='<h2>مدارس ابن رشد — تقرير متابعة أعمال الطلاب</h2>'+Object.entries(names).map(([k,v])=>`<p style="border-bottom:1px solid #ddd;padding:10px"><b>${v}:</b> ${esc(r[k])||'—'}</p>`).join('')+'<p class="muted">تقرير صادر من منصة متابعة أعمال الطلاب</p><button class="btn noprint" onclick="window.print()">طباعة التقرير</button><button class="btn secondary noprint" id="closePrint">العودة للأرشيف</button>';$('formPage').classList.add('hidden');$('archivePage').classList.add('hidden');$('printView').classList.remove('hidden');$('closePrint').onclick=()=>showPage('archive')}
